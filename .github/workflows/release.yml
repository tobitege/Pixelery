name: Pixelery Release

# MANUAL TRIGGER ONLY - Creates a GitHub release with Native AOT application archives
# Go to Actions → Pixelery Release → Run workflow → Enter version (e.g., 0.1.0)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0) - without "v" prefix'
        required: true
        type: string
      skip_tag:
        description: 'Skip tag creation (assumes you already pushed the tag manually)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use semantic versioning (e.g., 0.1.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION, Tag: v$VERSION"

  build-app:
    needs: validate
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'

      - name: Build solution
        run: dotnet build Pixelery.slnx -c Release -nologo

      - name: Publish Pixelery (Native AOT)
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          dotnet publish Pixelery/Pixelery.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -o publish `
            -nologo
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }

      - name: Publish Pixelery CLI (Native AOT)
        run: |
          $version = '${{ needs.validate.outputs.version }}'
          dotnet publish Pixelery.Cli/Pixelery.Cli.csproj `
            -c Release `
            -r win-x64 `
            -p:Version=$version `
            -p:AssemblyVersion="$version.0" `
            -p:FileVersion="$version.0" `
            -o publish-cli `
            -nologo
          if ($LASTEXITCODE -ne 0) { throw 'CLI publish failed.' }

      - name: Verify Native AOT outputs
        run: |
          ./tools/Test-NativePublish.ps1 -Directory publish -Executable Pixelery.exe
          ./tools/Test-NativePublish.ps1 -Directory publish-cli -Executable Pixelery.Cli.exe

      - name: Run published CLI smoke test
        env:
          PIXELERY_STATE_ROOT: ${{ runner.temp }}/Pixelery/State
        run: ./tools/Test-CliSmoke.ps1 -CliPath publish-cli/Pixelery.Cli.exe -OutputDirectory "$env:RUNNER_TEMP/Pixelery/Tests/Smoke" -ExpectedVersion '${{ needs.validate.outputs.version }}'

      - name: Package release assets
        run: |
          ./tools/New-ReleaseArchive.ps1 -PublishDirectory publish -Executable Pixelery.exe -ArchivePath final/Pixelery-Windows-x64.zip
          ./tools/New-ReleaseArchive.ps1 -PublishDirectory publish-cli -Executable Pixelery.Cli.exe -ArchivePath final/Pixelery.Cli-Windows-x64.zip

      - name: Build NSIS installer
        run: |
          $nsis = ./tools/Get-Nsis.ps1 -Directory "$env:RUNNER_TEMP/Pixelery/Tools"
          ./tools/New-Installer.ps1 -AppDirectory publish -CliDirectory publish-cli -OutputDirectory final -NsisPath $nsis -Version '${{ needs.validate.outputs.version }}'

      - name: Test per-user installer and shared application directory
        run: ./tools/Test-Installer.ps1 -InstallerPath 'final/Pixelery-Setup-${{ needs.validate.outputs.version }}-x64.exe' -AppDirectory publish -CliDirectory publish-cli -OutputDirectory "$env:RUNNER_TEMP/Pixelery/Tests/Installer" -ExpectedVersion '${{ needs.validate.outputs.version }}'

      - name: Sign update feed and installer
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.PIXELERY_UPDATE_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) { throw 'PIXELERY_UPDATE_PRIVATE_KEY is required for release signing.' }
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw 'Signing tool restore failed.' }
          $keys = "$env:RUNNER_TEMP/Pixelery/ReleaseSigning"
          New-Item -ItemType Directory -Path $keys -Force | Out-Null
          [IO.File]::WriteAllText("$keys/NetSparkle_Ed25519.priv", $env:UPDATE_PRIVATE_KEY.Trim())
          Copy-Item -LiteralPath Pixelery.Updates/UpdatePublicKey.txt -Destination "$keys/NetSparkle_Ed25519.pub"
          ./tools/New-UpdateFeed.ps1 -InstallerPath 'final/Pixelery-Setup-${{ needs.validate.outputs.version }}-x64.exe' -Version '${{ needs.validate.outputs.version }}' -OutputDirectory final -KeyDirectory $keys

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pixelery-Windows-x64
          path: |
            ./final/*.zip
            ./final/Pixelery-Setup-*-x64.exe
            ./final/appcast.xml
            ./final/appcast.xml.signature
          if-no-files-found: error

  publish:
    needs: [validate, build-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts

      - name: Collect artifacts
        run: |
          mkdir -p ./final
          find ./release-artifacts -name "*.zip" -exec cp {} ./final/ \;
          find ./release-artifacts -name "Pixelery-Setup-*-x64.exe" -exec cp {} ./final/ \;
          find ./release-artifacts -name "appcast.xml*" -exec cp {} ./final/ \;
          echo "=== Release artifacts ==="
          ls -la ./final/

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          CHANGELOG=""
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version from CHANGELOG.md
            CHANGELOG=$(awk -v ver="$VERSION" '
              /^## \[/ {
                if (found) exit
                if ($0 ~ "\\[" ver "\\]") found=1
              }
              found && !/^## \[/ { print }
            ' CHANGELOG.md)
          fi

          if [ -z "$CHANGELOG" ]; then
            echo "⚠️ No changelog entry found for version $VERSION"
            CHANGELOG="No changelog entry for this version."
          fi

          echo "$CHANGELOG" > changelog_section.md
          echo "✅ Extracted changelog for v$VERSION"

      - name: Create and push tag
        if: ${{ inputs.skip_tag != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ needs.validate.outputs.tag }}
          git push origin ${{ needs.validate.outputs.tag }}
          echo "✅ Created tag: ${{ needs.validate.outputs.tag }}"

      - name: Skip tag creation
        if: ${{ inputs.skip_tag == true }}
        run: echo "⏭️ Skipping tag creation (tag already exists)"

      - name: Build release notes
        run: |
          cat > release_notes.md << 'HEADER'
          ## 📋 What's Changed
          HEADER
          cat changelog_section.md >> release_notes.md
          cat >> release_notes.md << 'APP'

          ---

          ## 🎨 Download

          Native AOT applications (no .NET or Windows App SDK install required). The per-user installer includes the app and CLI in one directory. Alternatively, extract a portable ZIP and keep all its files together.

          | Asset | Description |
          |-------|-------------|
          | `Pixelery-Setup-${{ needs.validate.outputs.version }}-x64.exe` | Per-user installer including the app and command line tool |
          | `Pixelery-Windows-x64.zip` | App (Windows x64); run `Pixelery.exe` |
          | `Pixelery.Cli-Windows-x64.zip` | Command line tool; run `Pixelery.Cli.exe --help` |
          APP

          echo "=== Release Notes ==="
          cat release_notes.md

      - name: Load custom release notes
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            cat release_notes.md
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "v${{ needs.validate.outputs.version }}"
          files: ./final/*
          generate_release_notes: true
          body: ${{ steps.release_body.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
