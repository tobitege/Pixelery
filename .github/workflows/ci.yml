name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Build, test, publish, and smoke test
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'

      - name: Restore solution
        run: dotnet restore Pixelery.slnx

      - name: Build solution
        run: dotnet build Pixelery.slnx -c Release --no-restore -nologo

      - name: Run Core tests
        env:
          PIXELERY_TEST_ROOT: ${{ runner.temp }}/Pixelery/Tests
        run: dotnet test Pixelery.Core.Tests/Pixelery.Core.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Publish Windows app
        run: dotnet publish Pixelery/Pixelery.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -o artifacts/publish/app -nologo

      - name: Publish Windows CLI
        run: dotnet publish Pixelery.Cli/Pixelery.Cli.csproj -c Release -r win-x64 -o artifacts/publish/cli -nologo

      - name: Verify single-file outputs
        run: |
          $outputs = @{
            'artifacts/publish/app' = 'Pixelery.exe'
            'artifacts/publish/cli' = 'pixelery.exe'
          }
          foreach ($folder in $outputs.Keys) {
            $files = @(Get-ChildItem -LiteralPath $folder -File -Recurse)
            if ($files.Count -ne 1 -or $files[0].Name -cne $outputs[$folder]) {
              throw ('Expected only {0} in {1}.' -f $outputs[$folder], $folder)
            }
          }

      - name: Run published CLI smoke test
        env:
          PIXELERY_STATE_ROOT: ${{ runner.temp }}/Pixelery/State
        run: ./tools/Test-CliSmoke.ps1 -CliPath artifacts/publish/cli/pixelery.exe -OutputDirectory "$env:RUNNER_TEMP/Pixelery/Tests/Smoke"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows executables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Pixelery-Windows-x64-CI
          path: |
            artifacts/publish/app/Pixelery.exe
            artifacts/publish/cli/pixelery.exe
          if-no-files-found: error
          retention-days: 7
