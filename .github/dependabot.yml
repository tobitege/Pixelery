version: 2
updates:
  - package-ecosystem: nuget
    # The root solution includes every project and the central package versions.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      skia:
        patterns:
          - "SkiaSharp*"
          - "HarfBuzzSharp*"
      skia-security:
        applies-to: security-updates
        patterns:
          - "SkiaSharp*"
          - "HarfBuzzSharp*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
